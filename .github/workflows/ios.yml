name: Build iPhone app (.ipa)

# Builds an UNSIGNED Reversal.ipa on a macOS runner. Sideloading apps (SideStore, AltStore,
# Feather, ESign, Sideloadly, TrollStore) re-sign it on install. Every push to main that touches
# ios/ publishes a fresh release you can download on your iPhone from GitHub.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${GITHUB_RUN_NUMBER}\"/" project.yml
          xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project Reversal.xcodeproj -scheme Reversal -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Reversal.app Payload/
          zip -qry Reversal.ipa Payload
          ls -la Reversal.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Reversal-ipa
          path: ios/Reversal.ipa
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" ios/Reversal.ipa --title "Reversal iOS build ${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned IPA — install with your sideloading app (it re-signs). Commit ${GITHUB_SHA::7}." --latest
